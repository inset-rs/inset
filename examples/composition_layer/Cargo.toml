[package]
name = "composition_layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
waft-embedder.workspace = true
waft-embedder-winit.workspace = true
waft-foundation.workspace = true
waft-macros.workspace = true
waft-painting.workspace = true
waft-scheduler.workspace = true
waft-shell.workspace = true
waft-widgets.workspace = true

# What a producer draws into: IOSurfaces, allocated and filled on the CPU.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-io-surface = { version = "0.3", features = ["libc"] }

# Allocating and filling an IOSurface needs `unsafe`, which the workspace forbids; here it is
# denied instead, and `iosurface.rs` alone allows it.
[lints.rust]
unsafe_code = "deny"
