[package]
name = "android_composition"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[package.metadata.waft]
identifier = "rs.waft.android-composition"
name = "Android composition"

# The activity loads the library; the binary is the desktop's, which says the example is
# Android's. Named apart from the binary: on Windows a cdylib and a binary of one name write the
# same `.pdb`.
[lib]
name = "android_composition_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "android_composition"
path = "src/main.rs"

[dependencies]
waft.workspace = true
waft-embedder.workspace = true
waft-foundation.workspace = true
waft-painting.workspace = true
waft-scheduler.workspace = true
waft-widgets.workspace = true

# The renderer's device the producer draws on, and the system's log it reports to.
[target.'cfg(target_os = "android")'.dependencies]
waft-embedder-android.workspace = true
wgpu.workspace = true
ndk-sys = "0.6"

# Writing to the system's log needs `unsafe`, which the workspace forbids; here it is denied
# instead, and `log.rs` alone allows it.
[lints.rust]
unsafe_code = "deny"
