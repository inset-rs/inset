[package]
name = "winui_gallery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[package.metadata.waft]
identifier = "rs.waft.winui-gallery"
name = "WinUI Gallery"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
waft.workspace = true
waft-winui.workspace = true
waft-embedder.workspace = true
waft-foundation.workspace = true
waft-painting.workspace = true
waft-rendering.workspace = true
waft-shell.workspace = true
waft-widgets.workspace = true
[dev-dependencies]
waft-animation.workspace = true
waft-test.workspace = true
waft-services.workspace = true
waft-gestures.workspace = true
waft-scheduler.workspace = true
waft-winui-test-support.workspace = true
[lints]
workspace = true

[[bin]]
name = "winui-gallery"
path = "src/main.rs"
