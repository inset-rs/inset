[package]
name = "view_on_layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
waft-embedder.workspace = true
waft-embedder-winit.workspace = true
waft-foundation.workspace = true
waft-macros.workspace = true
waft-gestures.workspace = true
waft-painting.workspace = true
waft-rendering.workspace = true
waft-scheduler.workspace = true
waft-shell.workspace = true
waft-widgets.workspace = true

# The layer of the window's view, which the added view's layer is placed in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSView", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

# Reaching the window's view through its native handle needs `unsafe`, which the workspace
# forbids; here it is denied instead, and `window_layer.rs` alone allows it.
[lints.rust]
unsafe_code = "deny"
