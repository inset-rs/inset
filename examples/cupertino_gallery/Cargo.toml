[package]
name = "cupertino-gallery"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
indexmap.workspace = true
inset-animation.workspace = true
inset-cupertino.workspace = true
inset-embedder.workspace = true
inset-embedder-default.workspace = true
inset-foundation.workspace = true
inset-painting.workspace = true
# The flex enums (`MainAxisAlignment`, `CrossAxisAlignment`) live here, as Flutter's do in
# `rendering/`; inset-widgets re-exports the widget half only.
inset-rendering.workspace = true
inset-shell.workspace = true
inset-widgets.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[features]
default = ["native"]
# The binary. Off, wasm-pack does not build `src/main.rs`.
native = []

[[bin]]
name = "cupertino-gallery"
path = "src/main.rs"
required-features = ["native"]

[dev-dependencies]
inset-gestures.workspace = true
inset-scheduler.workspace = true
valo-system-fonts.workspace = true

[lints]
workspace = true
