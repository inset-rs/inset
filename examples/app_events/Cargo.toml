[package]
name = "app-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[package.metadata.waft]
identifier = "rs.waft.app-events"
name = "App events"

# A type of this app's own, which the bundle declares and ranks it the owner of.
[[package.metadata.waft.file_associations]]
extensions = ["waftnote"]
name = "Waft note"
owner = true
role = "editor"

# Another app's type, which the bundle only imports and opens.
[[package.metadata.waft.file_associations]]
extensions = ["waftpeer"]
name = "Peer document"
identifier = "org.example.peer-document"

[dependencies]
waft-embedder.workspace = true
waft-embedder-winit.workspace = true
waft-foundation.workspace = true
waft-painting.workspace = true
waft-shell.workspace = true
waft-widgets.workspace = true

[lints]
workspace = true
