[package]
name = "app-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[package.metadata.inset]
identifier = "rs.inset.app-events"
name = "App events"

# A type of this app's own, which the bundle declares and ranks it the owner of.
[[package.metadata.inset.file_types]]
extensions = ["insetnote"]
name = "Inset note"
owner = true
role = "editor"

# Another app's type, which the bundle only imports and opens.
[[package.metadata.inset.file_types]]
extensions = ["insetpeer"]
name = "Peer document"
identifier = "org.example.peer-document"

[dependencies]
inset-embedder.workspace = true
inset-embedder-winit.workspace = true
inset-foundation.workspace = true
inset-painting.workspace = true
inset-shell.workspace = true
inset-widgets.workspace = true

[lints]
workspace = true
