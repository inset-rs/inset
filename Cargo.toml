[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
version = "0.5.0"
license = "MIT"
repository = "https://github.com/xtyxtyx/waft-ui"
homepage = "https://waft.rs"
keywords = ["ui", "gui", "flutter"]
categories = ["gui"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
arboard = "3"
async-task = "4"
indexmap = "2"
waft = { version = "0.5.0", path = "crates/waft" }
waft-animation = { version = "0.5.0", path = "crates/waft-animation" }
waft-cupertino = { version = "0.5.0", path = "crates/waft-cupertino" }
waft-embedder = { version = "0.5.0", path = "crates/waft-embedder" }
waft-embedder-android = { version = "0.5.0", path = "crates/waft-embedder-android" }
waft-embedder-default = { version = "0.5.0", path = "crates/waft-embedder-default" }
waft-embedder-web = { version = "0.5.0", path = "crates/waft-embedder-web" }
waft-embedder-winit = { version = "0.5.0", path = "crates/waft-embedder-winit" }
waft-foundation = { version = "0.5.0", path = "crates/waft-foundation" }
waft-gestures = { version = "0.5.0", path = "crates/waft-gestures" }
waft-markdown = { version = "0.5.0", path = "crates/waft-markdown" }
waft-macros = { version = "0.5.0", path = "crates/waft-macros" }
waft-painting = { version = "0.5.0", path = "crates/waft-painting" }
waft-physics = { version = "0.5.0", path = "crates/waft-physics" }
waft-rendering = { version = "0.5.0", path = "crates/waft-rendering" }
waft-scheduler = { version = "0.5.0", path = "crates/waft-scheduler" }
waft-services = { version = "0.5.0", path = "crates/waft-services" }
waft-shell = { version = "0.5.0", path = "crates/waft-shell" }
waft-single-instance = { version = "0.5.0", path = "crates/waft-single-instance" }
waft-test = { version = "0.5.0", path = "crates/waft-test" }
waft-widgets = { version = "0.5.0", path = "crates/waft-widgets" }
waft-winui = { version = "0.5.0", path = "crates/waft-winui" }
waft-winui-test-support = { path = "crates/waft-winui-test-support" }
pulldown-cmark = { version = "0.13", default-features = false }
slotmap = "1"
unicode-general-category = "1"
unicode-segmentation = "1"
winit = "=0.31.0-beta.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
valo = "0.22.0"
valo-codec = "0.22.0"
valo-system-fonts = "0.22.0"
valo-geometry = "0.22.0"
wgpu = "30"
pollster = "0.4"
png = "0.17"
web-time = "1"

# Every crate outside the workspace, valo's and wgpu's among them, with line tables as its only
# debug information in debug builds, their build scripts and proc macros too: a backtrace still
# names their files and lines, while the workspace's own crates keep all of it for the debugger.
# The rest was 0.4 GB of the 10 GB a fresh `cargo test --workspace --no-run` wrote.
[profile.dev.package."*"]
debug = "line-tables-only"
