[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/inset-rs/inset"
homepage = "https://inset.rs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
arboard = "3"
async-task = "4"
indexmap = "2"
inset-animation = { path = "crates/inset-animation" }
inset-cupertino = { path = "crates/inset-cupertino" }
inset-embedder = { path = "crates/inset-embedder" }
inset-embedder-default = { path = "crates/inset-embedder-default" }
inset-embedder-web = { path = "crates/inset-embedder-web" }
inset-embedder-winit = { path = "crates/inset-embedder-winit" }
inset-foundation = { path = "crates/inset-foundation" }
inset-gestures = { path = "crates/inset-gestures" }
inset-painting = { path = "crates/inset-painting" }
inset-physics = { path = "crates/inset-physics" }
inset-rendering = { path = "crates/inset-rendering" }
inset-scheduler = { path = "crates/inset-scheduler" }
inset-services = { path = "crates/inset-services" }
inset-shell = { path = "crates/inset-shell" }
inset-widgets = { path = "crates/inset-widgets" }
slotmap = "1"
unicode-general-category = "1"
unicode-segmentation = "1"
winit = "0.30"
valo = "0.4.4"
valo-codec = "0.4.4"
valo-system-fonts = "0.4.4"
valo-geometry = "0.4.4"
wgpu = "30"
pollster = "0.4"
web-time = "1"
