# Builds the three widget kit galleries (WinUI, Cupertino, Material) to WebAssembly + WebGPU
# with `cargo waft build web` and deploys them to Cloudflare Pages on release tags (`v*`)
# or when triggered manually.
name: Galleries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: galleries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_OPT_LEVEL: s
      CARGO_PROFILE_RELEASE_STRIP: symbols
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: winui_gallery
            project: winui-gallery
          - package: cupertino-gallery
            project: cupertino-gallery
          - package: material-gallery
            project: material-gallery
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, with the web's target added to it.
      - name: The pinned toolchain, with the wasm target
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build ${{ matrix.package }} for web
        run: |
          cargo run -p waft-cli -- waft build -p "${{ matrix.package }}" web
          rm -f target/waft/web/release/*.br
      - name: Deploy ${{ matrix.project }} to Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy target/waft/web/release --project-name=${{ matrix.project }} --branch=main
