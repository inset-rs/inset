# Every change: the workspace is formatted and its tests pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request makes the run before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: No thread of its own
        run: |
          for manifest in crates/*/Cargo.toml; do
            case "$manifest" in
              crates/waft-embedder-* | crates/waft-cli/* | crates/waft-single-instance/* | crates/waft-macros/* | crates/waft/*) continue ;;
            esac
            cargo clippy --manifest-path "$manifest" --all-targets -- -D clippy::disallowed_methods
          done
      - name: Tests
        run: cargo test --workspace --no-fail-fast
