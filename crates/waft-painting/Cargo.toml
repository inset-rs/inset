[package]
name = "waft-painting"
description = "Alignment, decoration, and text painting for Waft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# The request and response values a network image is fetched with.
http.workspace = true
indexmap.workspace = true
waft-embedder.workspace = true
waft-foundation.workspace = true
waft-gestures.workspace = true
waft-scheduler.workspace = true
waft-services.workspace = true

[features]
# flutter_test's fonts (`PaintingBinding::install_flutter_test_fonts`), for the tests of a crate above this one.
test-support = ["waft-embedder/test-support"]

[dev-dependencies]
waft-embedder = { workspace = true, features = ["test-support"] }
# A platform with an HTTP client and a file system in memory, and an image codec.
waft-test.workspace = true
valo.workspace = true
valo-system-fonts.workspace = true

[lints]
workspace = true
