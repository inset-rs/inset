[package]
name = "waft-embedder-winit"
description = "Native winit host for Waft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["image-apple", "image-software", "image-worker"]
image-software = ["dep:valo-codec-software"]
image-apple = ["dep:valo-codec-apple"]
image-worker = ["valo-codec/worker"]
# The system's players without the event loop, for a test that serves the main thread itself.
test-support = []

[dependencies]
waft-embedder.workspace = true
valo.workspace = true
valo-codec.workspace = true
# The steps of a clip's path, handed to Core Animation as a mask.
valo-geometry.workspace = true
valo-codec-software = { version = "0.21.1", optional = true }
wgpu.workspace = true
pollster.workspace = true
winit.workspace = true
# The user's languages, as each system lists them.
sys-locale = "0.3"


# The clipboard's plain text where the embedder has no system code of its own for one.
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
arboard.workspace = true

# The clipboard's sequence number, menus at a point, icons in the notification area, opening
# through the shell and the console of the process that started the app, at the version arboard
# reaches Windows' clipboard with.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
# The shell's file dialogs, COM interfaces windows-sys does not carry, WinRT's toasts, and
# DirectComposition, D3D12's shared textures and DXGI's outputs, at the version wgpu builds, so a
# D3D12 resource is wgpu-hal's type; windows-core for the toast activator's COM classes, which
# `implement` writes in its name; windows-numerics for a visual's transform; and a toast's image
# as the PNG file it is read from.
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Foundation_Collections", "UI_Notifications", "Win32_Foundation", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Direct3D12", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Storage_Packaging_Appx", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Notifications", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-core = "0.62"
windows-numerics = "0.3"
png = "0.18"
# wgpu-hal's D3D12 backend, which wraps a shared texture opened on Waft's device as one of wgpu's.
wgpu-hal = { version = "30", features = ["dx12"] }

# The tray's StatusNotifierItems and their DBus menus, over the session bus, and a menu item's icon
# as the PNG the DBus menu takes. zbus is pure Rust; its 5.x line keeps the blocking API that the
# embedder, which runs no async executor, calls.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
png = "0.18"
# Composition layers on Wayland: Waft's share of winit's connection (the system libwayland, which
# winit's is too), the globals they need, and GBM, loaded at run time, for their buffers.
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
libloading = "0.8"
libc = "0.2"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
valo-codec-apple = { version = "0.21.1", optional = true }
# The pasteboards' completion handlers and load handlers, and the main queue the app's futures run
# on for them.
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject", "NSGeometry", "NSArray", "NSAttributedString", "NSBundle", "NSCalendar", "NSData", "NSDate", "NSDictionary", "NSError", "NSSet", "NSIndexSet", "NSItemProvider", "NSKeyValueObserving", "NSLocale", "NSNotification", "NSOperation", "NSProgress", "NSPropertyList", "NSRange", "NSRunLoop", "NSURL", "NSValue", "NSProcessInfo", "NSTimeZone", "NSUserDefaults", "block2"] }
# The UTI a pasteboard names a MIME type by.
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType", "UTCoreTypes"] }
# Notifications, a notification's time as a calendar date, and its image as the PNG file an
# attachment is made from.
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNError", "UNNotification", "UNNotificationAction", "UNNotificationAttachment", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
png = "0.18"
# Composition layers: the Core Animation layers they are, the buffer each shows and whether the
# compositor still reads it, the transform that places a layer with its children, the shapes that
# clip it, and the colour a window shows behind them while its view draws nothing; the bitmap a
# media asset's picture is drawn into a frame's pixel buffer through; and the image over pixels an
# image codec encodes.
objc2-quartz-core = { version = "0.3", features = ["CABase", "CALayer", "CAShapeLayer", "CATransaction", "CATransform3D"] }
objc2-io-surface = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFBase", "CFCGTypes", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColor", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage", "CGPath"] }
# Players, media assets and cameras: AVFoundation, the times and sample buffers it speaks in, the
# markup of the subtitles it hands out, the pixel buffers a frame reader hands out, and the images
# an asset's pictures come as, drawn into such buffers.
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "dispatch2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "objc2-core-video", "objc2-quartz-core", "AVAnimation", "AVAsset", "AVAssetImageGenerator", "AVAssetTrack", "AVAsynchronousKeyValueLoading", "AVCaptureDevice", "AVCaptureFileOutput", "AVCaptureInput", "AVCaptureOutputBase", "AVCapturePhotoOutput", "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureVideoDataOutput", "AVCaptureVideoPreviewLayer", "AVError", "AVMediaFormat", "AVMediaSelection", "AVMediaSelectionGroup", "AVMetadataIdentifiers", "AVMetadataItem", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVPlayerItemTrack", "AVPlayerLayer", "AVTime", "AVVideoSettings"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "objc2-core-video", "CMBase", "CMFormatDescription", "CMSampleBuffer", "CMSync", "CMTextMarkup", "CMTime"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-io-surface", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface", "CVReturn"] }
# The user's caption style, its colours matched to sRGB above, and the family of the font it names.
objc2-media-accessibility = { version = "0.3", default-features = false, features = ["std", "MACaptionAppearance", "objc2-core-graphics", "objc2-core-text"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontDescriptor"] }
# The system's image codecs: Image I/O's sources and destinations and the properties they read
# and write, and the data providers an image's pixels are handed to them in.
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "objc2-core-graphics", "CGImageDestination", "CGImageProperties", "CGImageSource"] }
# A hardware buffer's texture, a video frame's among them: a Metal texture over its `IOSurface`, on
# the Metal device behind the wgpu device it is imported on.
objc2-metal = { version = "0.3", default-features = false, features = ["std", "objc2-io-surface", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes"] }

[target.'cfg(target_os = "ios")'.dependencies]
# The general pasteboard, and the notices that it changed or the application became active.
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-quartz-core", "objc2-uniform-type-identifiers", "UIPasteboard", "UIApplication", "objc2-core-foundation", "UIDocumentInteractionController", "UIDocumentPickerViewController", "UIResponder", "UIView", "UIViewController", "UIWindow"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphicsContext", "NSView", "NSCell", "NSResponder", "NSWindow", "NSScreen", "NSAnimation", "NSAnimationContext", "NSVisualEffectView", "NSGlassEffectView", "NSGraphics", "NSTrackingArea", "NSPasteboard", "NSPasteboardItem", "NSFilePromiseProvider", "NSFilePromiseReceiver", "NSOpenPanel", "NSSavePanel", "NSWorkspace", "objc2-uniform-type-identifiers", "NSTouch", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSButtonCell", "NSActionCell", "NSColorSpace", "block2", "objc2-quartz-core"] }
# The display links' timing, and the `CAMetalLayer` a view draws into.
objc2-quartz-core = { version = "0.3", features = ["CAMediaTimingFunction", "CADisplayLink", "CAMetalLayer"] }

# Each test is a program of its own, without the test harness, which runs every test on a thread
# it spawns: winit makes AppKit's event loop on the main thread only, once per process, and a
# test may end by quitting the process. A test file without an entry here runs under the
# harness, whose `main` replaces the test's, and passes having run nothing.
[[test]]
name = "a_hidden_window_takes_no_frames_while_a_shown_one_draws"
harness = false

[[test]]
name = "a_vsync_waiter_calls_once_per_wait"
harness = false

[[test]]
name = "an_app_goes_on_while_a_popup_menu_is_open"
harness = false

[[test]]
name = "a_late_answer_to_an_exit_quits"
harness = false

[[test]]
name = "closed_windows_are_released"
harness = false

[[test]]
name = "the_lifecycle_follows_the_application"
harness = false

[[test]]
name = "commands_are_served_in_order"
harness = false

[[test]]
name = "an_app_asks_for_a_view_and_draws_in_it"
harness = false

[[test]]
name = "an_app_adds_a_view_on_a_layer_and_controls_it"
harness = false

[[test]]
name = "a_window_stays_open_until_the_app_closes_it"
harness = false

[[test]]
name = "a_view_is_on_a_screen_the_platform_lists"
harness = false

[[test]]
name = "a_window_tells_the_app_it_was_minimized_occluded_or_moved"
harness = false

[[test]]
name = "a_window_keeps_its_view_within_its_size_limits"
harness = false

[[test]]
name = "the_menus_report_what_is_chosen"
harness = false

[[test]]
name = "a_key_left_later_goes_to_the_menu_bar"
harness = false

[[test]]
name = "a_player_reads_the_frames_of_a_file"
harness = false

[[test]]
name = "an_asset_reads_its_length_tracks_and_pictures"
harness = false

[[test]]
name = "an_image_decodes_and_encodes_through_the_systems_codecs"
harness = false

# The test seam the media tests reach the system's players, media assets and image codecs through.
[dev-dependencies]
waft-embedder-winit = { path = ".", features = ["test-support"] }

# What the tests ask of AppKit that the host offers no call for: minimizing, hiding the
# application, whether a window's content has the layer a surface draws into, choosing in its
# menus, and pressing a key in a window that is not key.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSWindow", "NSView", "NSMenu", "NSMenuItem", "NSEvent", "block2", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer", "objc2-metal"] }

# What the media tests ask of the system that the host offers no call for: serving the main run
# loop, and reading a frame's pixel buffer.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dev-dependencies]
objc2-foundation = { version = "0.3", features = ["NSDate", "NSRunLoop", "NSString"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "objc2-io-surface", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferIOSurface"] }

# AppKit's selectors and view hierarchy, UIKit's pasteboard, document picker and view, the
# notification center's delegate and completion handlers, Core Animation's layers, AVFoundation,
# Media Accessibility, Image I/O, and Win32 and COM, the toast activator's included, need `unsafe`, which the
# workspace forbids; here it is denied instead, and `os/macos`, `os/apple/composition`,
# `os/apple/media`, `os/apple/image_codecs`, `os/apple/caption_appearance`, `os/apple/notifications`, `os/ios/pasteboard`,
# `os/ios/file_dialogs`, `os/ios/opener`, `os/ios/open_requests`, `os/ios/composition`,
# `os/windows`, `os/linux/wayland` and `os/linux/dmabuf` (libwayland's proxies, GBM, DRM and dma-buf
# ioctls) and the tests' AppKit support, for a local event monitor, alone allow it.
[lints.rust]
unsafe_code = "deny"
