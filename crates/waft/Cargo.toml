[package]
name = "waft"
description = "UI framework: Flutter's widgets, plus Entity, on a Rust render engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# The kits, for the test that their globs and the facade's never clash. A path and no version,
# so `cargo publish` leaves them out: the published facade depends on no kit.
[dev-dependencies]
waft-cupertino = { path = "../waft-cupertino" }
waft-material = { path = "../waft-material" }
waft-winui = { path = "../waft-winui" }

[dependencies]
waft-embedder.workspace = true
waft-embedder-default.workspace = true
waft-foundation.workspace = true
waft-gestures.workspace = true
waft-macros.workspace = true
waft-painting.workspace = true
waft-shell.workspace = true
waft-scheduler.workspace = true
waft-widgets.workspace = true

[lints]
workspace = true
