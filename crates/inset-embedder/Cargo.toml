test-support = ["dep:pollster", "dep:wgpu"]

[dependencies]
indexmap.workspace = true
raw-window-handle.workspace = true
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
valo.workspace = true
valo-geometry.workspace = true
valo-system-fonts.workspace = true
web-time.workspace = true

[dev-dependencies]

[lints]
workspace = true
