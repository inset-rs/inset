[package]
name = "inset-embedder"
description = "dart:ui host traits and value types for Inset"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Images and drawn pixels for tests, which need a GPU device to exist at all.
test-support = ["dep:pollster", "dep:wgpu"]

[dependencies]
indexmap.workspace = true
raw-window-handle.workspace = true
pollster = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
valo.workspace = true
valo-geometry.workspace = true
valo-system-fonts.workspace = true
web-time.workspace = true

# The buffer a producer hands a composited surface, and the picture a player or a camera hands a
# frame reader, are the platform's own types.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2-core-foundation = "0.3"
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }
objc2-io-surface = "0.3"

[dev-dependencies]

[lints]
workspace = true
