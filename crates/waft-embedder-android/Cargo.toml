[package]
name = "waft-embedder-android"
description = "Android host for Waft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["image-software", "image-worker"]
image-software = ["dep:valo-codec-software"]
image-worker = ["valo-codec/worker"]

[dependencies]
waft-embedder.workspace = true
raw-window-handle.workspace = true
pollster.workspace = true
valo.workspace = true
valo-codec.workspace = true
valo-codec-software = { version = "0.22.0", optional = true }
wgpu.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# The Vulkan calls that import a hardware buffer's memory, which wgpu-hal does not make: the
# version wgpu-hal uses, so its device's handles are this crate's types.
ash = { version = "0.38", default-features = false, features = ["std"] }
jni = "0.22.4"
# `poll` and `eventfd`, which wait for a buffer's release fence.
libc = "0.2"
# The VM and the application, for the crates written for Android that look them up there, such as
# cpal's audio.
ndk-context = "0.1"
# Android 12 (API 31) is the least the host runs on: its surface controls place a layer by
# position, scale and crop, which no earlier version has (`surface_control.rs`).
ndk = { version = "0.9", features = ["rwh_06", "api-level-31"] }
# `bitmap` links `libjnigraphics`, the NDK's image decoder and encoder (`image_codecs/`).
ndk-sys = { version = "0.6", features = ["bitmap"] }

# The NDK's C APIs — `NativeActivity`'s callbacks, the choreographer, the native window, surface
# controls, hardware buffers, JNI — and Vulkan's need `unsafe`, which the workspace forbids; here it
# is denied instead, and the modules that call them allow it.
[lints.rust]
unsafe_code = "deny"
