[package]
name = "waft-embedder-ios"
description = "iOS host for Waft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["image-apple", "image-software", "image-worker"]
image-apple = ["waft-embedder-apple/image-apple"]
image-software = ["dep:valo-codec-software"]
image-worker = ["valo-codec/worker"]
# The text field without the host, for the tests that run in the simulator.
test-support = []

[target.'cfg(target_os = "ios")'.dependencies]
waft-embedder.workspace = true
# Core Animation's compositor and the layer a view draws into, IOSurface buffers, AVFoundation's
# media, Image I/O's codecs and the notification center, which macOS shares.
waft-embedder-apple = { workspace = true, default-features = false }
valo.workspace = true
valo-codec.workspace = true
# The software decoder, behind `image-software`, for the images Image I/O does not take.
valo-codec-software = { version = "0.25.0", optional = true }
wgpu.workspace = true
pollster.workspace = true
# The main queue a wake from another thread reaches the host through.
dispatch2 = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDate", "NSDictionary", "NSIndexSet", "NSItemProvider", "NSLocale", "NSNotification", "NSObject", "NSOperation", "NSPropertyList", "NSRunLoop", "NSSet", "NSString", "NSURL", "NSValue", "block2"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
# The display link the frames are drawn at, and the layer of each view.
objc2-quartz-core = { version = "0.3", features = ["CABase", "CADisplayLink", "CAFrameRateRange", "CALayer", "objc2-core-foundation"] }
# The UTI a document picker names a file type by, and a pasteboard a MIME type.
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType", "UTCoreTypes"] }
# The application and its scenes, each scene's window, view controller and view, touches and
# presses, the keyboard's notices, the pasteboard, document pickers and opening.
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "objc2-core-foundation", "objc2-quartz-core", "objc2-uniform-type-identifiers", "NSText", "UIApplication", "UICommand", "UIDocumentInteractionController", "UIDocumentPickerViewController", "UIEvent", "UIGeometry", "UIInputViewController", "UIInterface", "UIKey", "UIKeyConstants", "UIOpenURLContext", "UIOrientation", "UIPasteboard", "UIPress", "UIPressesEvent", "UIResponder", "UIScene", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UIScreen", "UITextInput", "UITextInputTraits", "UITouch", "UITraitCollection", "UIView", "UIViewController", "UIWindow", "UIWindowScene"] }

# Each test is a program of its own, without the test harness, which runs every test on a thread
# it spawns, where UIKit's objects cannot be made: it runs in the simulator, `xcrun simctl spawn
# <device> <test binary>`, and on any other target is a program that does nothing.
[[test]]
name = "a_field_hands_the_framework_each_edit"
harness = false

[dev-dependencies]
waft-embedder-ios = { path = ".", features = ["test-support"] }
# The keys, the lifecycle and the metrics are tested on any machine, in the framework's terms.
waft-embedder.workspace = true

[target.'cfg(target_os = "ios")'.dev-dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSRange"] }

# UIKit's classes, delegates and notices, Core Animation's display link and the pasteboard's
# blocks need `unsafe`, which the workspace forbids; here it is denied instead, and the modules
# that define a class or call such an API alone allow it, each saying why.
[lints.rust]
unsafe_code = "deny"
