[package]
name = "waft-embedder"
description = "dart:ui host traits and value types for Waft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Images and drawn pixels for tests, which need a GPU device to exist at all.
test-support = ["dep:pollster"]
# Serde's derives for the values a host gives a view and takes from it, for an app that sends them
# between processes.
serde = ["dep:serde"]

[dependencies]
indexmap.workspace = true
raw-window-handle.workspace = true
pollster = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
valo.workspace = true
valo-geometry.workspace = true
valo-system-fonts.workspace = true
web-time.workspace = true
# The device a host imports a hardware buffer on as a texture (`Platform::import_texture`), and the
# texture: wgpu's own types, which valo takes without re-exporting them.
wgpu.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
