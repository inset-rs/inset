[package]
name = "inset-cli"
description = "cargo inset: run and package an Inset app for desktop, iOS, and the web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "cargo-inset"
path = "src/main.rs"

[dependencies]
anyhow = "1"
brotli = "8"
cargo-packager = { version = "0.11", default-features = false, features = ["rustls-tls"] }
cargo_metadata = "0.23"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
plist = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
ureq = "3"
zip = { version = "2", default-features = false }

[lints]
workspace = true
