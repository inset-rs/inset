[package]
name = "waft-markdown"
description = "Markdown widgets for Waft, with flutter_markdown's API ideas and look, built on pulldown-cmark"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
waft-embedder.workspace = true
waft-foundation.workspace = true
waft-gestures.workspace = true
waft-painting.workspace = true
waft-rendering.workspace = true
waft-widgets.workspace = true
pulldown-cmark.workspace = true

[dev-dependencies]
waft-scheduler.workspace = true
waft-test.workspace = true
# flutter_test's fonts, so text metrics do not follow the machine's fonts.
waft-painting = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
