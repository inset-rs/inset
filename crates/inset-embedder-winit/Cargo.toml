[package]
name = "inset-embedder-winit"
description = "Native winit host for Inset"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["image-apple", "image-software", "image-worker"]
image-software = ["dep:valo-codec-software"]
image-apple = ["dep:valo-codec-apple"]
image-worker = ["valo-codec/worker"]

[dependencies]
inset-embedder.workspace = true
valo.workspace = true
valo-codec.workspace = true
valo-codec-software = { version = "0.13.1", optional = true }
wgpu.workspace = true
pollster.workspace = true
winit.workspace = true
# The user's languages, as each system lists them.
sys-locale = "0.3"


# The clipboard's plain text where the embedder has no system code of its own for one.
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
arboard.workspace = true

# The clipboard's sequence number, menus at a point and icons in the notification area, at the
# version arboard reaches Windows' clipboard with.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# The shell's file dialogs, COM interfaces windows-sys does not carry, at the version wgpu builds.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

# The tray's StatusNotifierItems and their DBus menus, over the session bus, and a menu item's icon
# as the PNG the DBus menu takes. zbus is pure Rust; its 5.x line keeps the blocking API that the
# embedder, which runs no async executor, calls.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
png = "0.18"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
valo-codec-apple = { version = "0.13.1", optional = true }
# The pasteboards' completion handlers and load handlers, and the main queue the app's futures run
# on for them.
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject", "NSGeometry", "NSArray", "NSData", "NSDate", "NSDictionary", "NSError", "NSIndexSet", "NSItemProvider", "NSNotification", "NSOperation", "NSProgress", "NSPropertyList", "NSRunLoop", "NSURL", "NSValue", "NSProcessInfo", "block2"] }
# The UTI a pasteboard names a MIME type by.
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }

[target.'cfg(target_os = "ios")'.dependencies]
# The general pasteboard, and the notices that it changed or the application became active.
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "UIPasteboard", "UIApplication"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSEvent", "NSGraphicsContext", "NSView", "NSCell", "NSResponder", "NSWindow", "NSScreen", "NSAnimation", "NSAnimationContext", "NSVisualEffectView", "NSGlassEffectView", "NSGraphics", "NSTrackingArea", "NSPasteboard", "NSPasteboardItem", "NSFilePromiseProvider", "NSFilePromiseReceiver", "NSOpenPanel", "NSSavePanel", "objc2-uniform-type-identifiers", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSButtonCell", "NSActionCell", "NSColorSpace", "block2", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", features = ["CAMediaTimingFunction", "CADisplayLink", "CALayer", "CATransaction"] }
# The buffer a native surface shows, and whether the compositor still reads it.
objc2-io-surface = "0.3"

# Each test is a program of its own, without the test harness, which runs every test on a thread
# it spawns: winit makes AppKit's event loop on the main thread only, once per process, and a
# test may end by quitting the process. A test file without an entry here runs under the
# harness, whose `main` replaces the test's, and passes having run nothing.
[[test]]
name = "a_hidden_window_takes_no_frames_while_a_shown_one_draws"
harness = false

[[test]]
name = "a_vsync_waiter_calls_once_per_wait"
harness = false

[[test]]
name = "an_app_goes_on_while_a_popup_menu_is_open"
harness = false

[[test]]
name = "a_late_answer_to_an_exit_quits"
harness = false

[[test]]
name = "closed_windows_are_released"
harness = false

[[test]]
name = "the_lifecycle_follows_the_application"
harness = false

[[test]]
name = "commands_are_served_in_order"
harness = false

[[test]]
name = "an_app_asks_for_a_view_and_draws_in_it"
harness = false

[[test]]
name = "a_window_stays_open_until_the_app_closes_it"
harness = false

[[test]]
name = "a_view_is_on_a_screen_the_platform_lists"
harness = false

[[test]]
name = "a_window_tells_the_app_it_was_minimized_occluded_or_moved"
harness = false

[[test]]
name = "the_menus_report_what_is_chosen"
harness = false

[[test]]
name = "a_key_left_later_goes_to_the_menu_bar"
harness = false

# What the tests ask of AppKit that the host offers no call for: minimizing, hiding the
# application, whether a window's content has the layer a surface draws into, choosing in its
# menus, and pressing a key in a window that is not key.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSWindow", "NSView", "NSMenu", "NSMenuItem", "NSEvent", "block2", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSGeometry"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CAMetalLayer"] }

# AppKit's selectors and view hierarchy, UIKit's pasteboard and Win32 need `unsafe`, which the
# workspace forbids; here it is denied instead, and `os/macos`, `os/ios/pasteboard`, `os/windows`
# and the tests' AppKit support, for a local event monitor, alone allow it.
[lints.rust]
unsafe_code = "deny"
