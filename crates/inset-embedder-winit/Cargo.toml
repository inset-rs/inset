[package]
name = "inset-embedder-winit"
description = "Native winit host for Inset"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["image-apple", "image-software", "image-worker"]
image-software = ["dep:valo-codec-software"]
image-apple = ["dep:valo-codec-apple"]
image-worker = ["valo-codec/worker"]

[dependencies]
inset-embedder.workspace = true
valo.workspace = true
valo-codec.workspace = true
valo-codec-software = { version = "0.6.0", optional = true }
wgpu.workspace = true
pollster.workspace = true
winit.workspace = true
arboard.workspace = true


[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
valo-codec-apple = { version = "0.6.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem", "NSEvent", "NSView", "NSCell", "NSResponder", "NSWindow", "NSScreen", "NSAnimation", "NSAnimationContext", "NSVisualEffectView", "NSGlassEffectView", "NSGraphics", "NSTrackingArea", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSObject", "NSGeometry", "NSArray", "NSRunLoop"] }
objc2-quartz-core = { version = "0.3", features = ["CAMediaTimingFunction", "CADisplayLink"] }

# AppKit's selectors and view hierarchy need `unsafe`, which the workspace forbids; here it
# is denied instead, and `os/macos` alone allows it.
[lints.rust]
unsafe_code = "deny"
