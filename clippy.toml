# `Retained` hashes and compares by the object's id alone; its count's interior mutability never reaches a key.
ignore-interior-mutability = ["waft_foundation::Retained", "waft_foundation::handle_map::Retained"]

# A framework crate starts no thread of its own: a host's threads are its platform's, reached
# through `Dispatcher`. A platform starts the threads, and says so with `[package.metadata.waft]
# platform = true` in its own Cargo.toml; CI's thread check and the layering guard read that flag.
disallowed-methods = [
  { path = "std::thread::spawn", reason = "a framework crate starts no thread; ask the platform's Dispatcher" },
  { path = "std::thread::Builder::spawn", reason = "a framework crate starts no thread; ask the platform's Dispatcher" },
]
